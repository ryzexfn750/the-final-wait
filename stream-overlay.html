<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <meta name="referrer" content="no-referrer">
 <meta name="color-scheme" content="dark">
 <title>The Final Wait — Stream Overlay</title>
 <link rel="stylesheet" href="css/stream-overlay.css?v=3">
</head>
<body>
 <main id="streamSurface" class="stream-surface" aria-label="GTA VI live countdown overlay">
  <section id="streamWidget" class="stream-widget">
   <div class="stream-header">
    <img id="streamBrand" class="stream-logo" src="assets/ryze-gtavi-logo-lockup.png" alt="RyzeGTAVI">
    <strong class="stream-domain">thefinalwait.com</strong>
    <span id="streamZone" class="stream-zone">EUROPE/ROME</span>
   </div>
   <div id="streamNumbers" class="stream-numbers">
    <div class="stream-unit"><strong id="streamDays">00</strong><small>DAYS</small></div>
    <span class="stream-colon">:</span>
    <div class="stream-unit"><strong id="streamHours">00</strong><small>HOURS</small></div>
    <span class="stream-colon">:</span>
    <div class="stream-unit"><strong id="streamMinutes">00</strong><small>MINUTES</small></div>
    <span class="stream-colon">:</span>
    <div class="stream-unit"><strong id="streamSeconds">00</strong><small>SECONDS</small></div>
   </div>
   <div class="stream-progress" id="streamProgress">
    <div class="stream-progress-track"><i id="streamProgressFill"></i></div>
    <span id="streamPercent">0.00%</span>
   </div>
   <div id="streamReleased" class="stream-released" hidden>
    <strong>GTA VI IS OUT!</strong><span>THE WAIT IS OVER.</span>
   </div>
  </section>
 </main>
 <script type="module" src="js/stream-overlay.js?v=3"></script>
</body>
</html>
