<!doctype html>
<html lang="en">
<head>
 <script src="js/brand-protection.js?v=2"></script>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta name="robots" content="noindex,nofollow">
 <meta name="referrer" content="no-referrer">
 <meta name="color-scheme" content="dark">
 <title translate="no">The Final Wait — Stream Overlay</title>
 <link rel="stylesheet" href="css/stream-overlay.css?v=7">
</head>
<body>
 <main id="streamSurface" class="stream-surface" aria-label="GTA VI live countdown overlay">
  <section id="streamWidget" class="stream-widget">
   <div class="stream-atmosphere" aria-hidden="true">
    <i class="stream-depth-grid"></i><i class="stream-aurora"></i><i class="stream-edge-trace"></i>
    <i class="stream-light-stream stream-light-one"></i><i class="stream-light-stream stream-light-two"></i>
   </div>
   <div class="stream-header">
    <div class="stream-identity">
     <span class="stream-subtitle notranslate" translate="no">ROAD TO LEONIDA</span>
     <strong class="stream-domain">thefinalwait.com</strong>
    </div>
    <span id="streamZone" class="stream-zone">EUROPE/ROME</span>
   </div>
   <div id="streamNumbers" class="stream-numbers">
    <div class="stream-unit"><strong id="streamDays">00</strong><small>DAYS</small></div>
    <span class="stream-colon">:</span>
    <div class="stream-unit"><strong id="streamHours">00</strong><small>HOURS</small></div>
    <span class="stream-colon">:</span>
    <div class="stream-unit"><strong id="streamMinutes">00</strong><small>MINUTES</small></div>
    <span class="stream-colon">:</span>
    <div class="stream-unit"><strong id="streamSeconds">00</strong><small>SECONDS</small></div>
   </div>
   <div class="stream-progress" id="streamProgress">
    <div class="stream-progress-track"><i id="streamProgressFill"></i></div>
    <span id="streamPercent">0.00%</span>
   </div>
   <div id="streamReleased" class="stream-released" hidden>
    <div class="stream-release-halo" aria-hidden="true"></div>
    <strong>GTA VI IS OUT!</strong><span>THE WAIT IS OVER.</span>
   </div>
   <div id="streamCelebration" class="stream-celebration" aria-hidden="true" hidden>
    <i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i>
    <i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i>
    <i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i>
    <i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i>
   </div>
  </section>
 </main>
 <script defer src="js/stream-overlay-locales.js?v=2"></script>
 <script type="module" src="js/stream-overlay.js?v=8"></script>
</body>
</html>
